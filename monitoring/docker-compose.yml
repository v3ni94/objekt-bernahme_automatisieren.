# Statusseite der Mueller Holding AG (status.mueller-holding.ag): Messwerte des VPS und aller Container, gespeichert
# in Prometheus (Aufbewahrung 400 Tage), Oberflaeche im CI der Mueller Holding AG hinter Traefik. Oeffentlich lesbar
# oder, mit Profil "sso" (COMPOSE_PROFILES und STATUS_MIDDLEWARES in der .env), nur nach Anmeldung ueber das CRM.
# Eigenes Compose-Projekt, unabhaengig von der Objektakte. Einrichtung: docs/betrieb/statusseite.md.
# Messtakt: Wirt alle 15 s (node_exporter), Container alle 30 s (cAdvisor), HTTP-Pruefungen alle 60 s (Blackbox).
name: status

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  node-exporter:
    # Werte des Wirts (CPU je Kern, Speicher, Netz, Datentraeger, Prozesse). Braucht das Netz des Wirts fuer die
    # echten Schnittstellen und lauscht deshalb nur auf der Gateway-Adresse des Messnetzes, nicht oeffentlich.
    image: prom/node-exporter:v1.8.2
    <<: *logging
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --web.listen-address=${STATUS_GATEWAY}:9100
      - --collector.processes
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containers/.+)($$|/)
      - --collector.netdev.device-exclude=^(veth.*|br-.*|docker0|lo)$$
    volumes:
      - /:/host:ro,rslave
    security_opt:
      - no-new-privileges:true

  cadvisor:
    # Werte je Container (CPU, Speicher, Netz, E/A). privileged und /dev/kmsg entsprechen der Vorgabe des Projekts.
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    <<: *logging
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,hugetlb,referenced_memory,cpu_topology,resctrl,cpuset,process,memory_numa
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - mess

  blackbox:
    # HTTP-Pruefungen der eigenen Dienste (Erreichbarkeit, Antwortzeit, Zertifikatslaufzeit).
    image: prom/blackbox-exporter:v0.25.0
    <<: *logging
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - mess
    security_opt:
      - no-new-privileges:true

  prometheus:
    # Speicher der Messwerte. Kein Zugriff von aussen, die Oberflaeche fragt ueber nginx nur die Leseschnittstelle ab.
    image: prom/prometheus:v2.54.1
    <<: *logging
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION_TIME:-400d}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-60GB}
      - --web.page-title=Statusseite Mueller Holding AG
    extra_hosts:
      - "wirt:${STATUS_GATEWAY}"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks:
      - mess
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
    security_opt:
      - no-new-privileges:true

  web:
    # Oberflaeche im CI der Mueller Holding AG (statisch) plus Durchreichen der Leseabfragen an Prometheus.
    build: ./web
    image: status-web:local
    <<: *logging
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - mess
      - proxy
    security_opt:
      - no-new-privileges:true
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK}"
      traefik.http.routers.mhag-status.rule: "Host(`${STATUS_DOMAIN}`)"
      traefik.http.routers.mhag-status.entrypoints: "${TRAEFIK_ENTRYPOINT}"
      traefik.http.routers.mhag-status.tls: "true"
      traefik.http.routers.mhag-status.tls.certresolver: "${TRAEFIK_CERTRESOLVER}"
      # Middleware-Kette aus der .env: oeffentlich (Anfragebegrenzung, Kopfzeilen) oder mit CRM-Anmeldung
      # (zusaetzlich mhag-status-fehler und mhag-status-auth des Dienstes oauth2-proxy, Profil "sso").
      # Die Anfragebegrenzung je Adresse schuetzt die Messdatenbank vor Ueberlastung ueber die Leseschnittstelle.
      traefik.http.routers.mhag-status.middlewares: "${STATUS_MIDDLEWARES:-mhag-status-ratelimit,mhag-status-headers}"
      traefik.http.middlewares.mhag-status-ratelimit.ratelimit.average: "30"
      traefik.http.middlewares.mhag-status-ratelimit.ratelimit.burst: "80"
      traefik.http.middlewares.mhag-status-ratelimit.ratelimit.period: "1s"
      traefik.http.middlewares.mhag-status-headers.headers.stsSeconds: "31536000"
      traefik.http.middlewares.mhag-status-headers.headers.contentTypeNosniff: "true"
      traefik.http.middlewares.mhag-status-headers.headers.customFrameOptionsValue: "DENY"
      traefik.http.middlewares.mhag-status-headers.headers.referrerPolicy: "no-referrer"
      traefik.http.services.mhag-status.loadbalancer.server.port: "8080"

  oauth2-proxy:
    # Anmeldung ueber das CRM: der OIDC-Anbieter der Plattform (STATUS_SSO_ISSUER) bestaetigt die Identitaet, der
    # Proxy fuehrt eine eigene Sitzung (Cookie, 12 Stunden). Traefik fragt vor jeder Anfrage an die Oberflaeche hier
    # nach (ForwardAuth); 401/403 werden in die Anmeldung umgeleitet, die bei bestehender CRM-Sitzung ohne Eingabe
    # durchlaeuft. Nur im Profil "sso" aktiv (COMPOSE_PROFILES=sso in der .env), sonst nicht gestartet.
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
    <<: *logging
    restart: unless-stopped
    profiles: ["sso"]
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: CRM
      OAUTH2_PROXY_OIDC_ISSUER_URL: "${STATUS_SSO_ISSUER}"
      OAUTH2_PROXY_CLIENT_ID: "${STATUS_SSO_CLIENT_ID}"
      OAUTH2_PROXY_CLIENT_SECRET: "${STATUS_SSO_CLIENT_SECRET}"
      OAUTH2_PROXY_COOKIE_SECRET: "${STATUS_SSO_COOKIE_SECRET}"
      OAUTH2_PROXY_REDIRECT_URL: "https://${STATUS_DOMAIN}/oauth2/callback"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_WHITELIST_DOMAINS: "${STATUS_DOMAIN}"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_SCOPE: "openid email profile"
      # Das ID-Token des CRM traegt kein email_verified; Benutzer werden im CRM vom Betreiber gepflegt.
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"
      OAUTH2_PROXY_COOKIE_NAME: "_mhag_status"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: "12h"
      OAUTH2_PROXY_SILENCE_PING_LOGGING: "true"
      OAUTH2_PROXY_REQUEST_LOGGING: "false"
    networks:
      mess: {}
      proxy:
        aliases:
          - mhag-status-oauth
    security_opt:
      - no-new-privileges:true
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK}"
      # Anmeldepfade (/oauth2/start, /oauth2/callback, /oauth2/sign_out) gehen direkt an den Proxy.
      traefik.http.routers.mhag-status-oauth.rule: "Host(`${STATUS_DOMAIN}`) && PathPrefix(`/oauth2/`)"
      traefik.http.routers.mhag-status-oauth.entrypoints: "${TRAEFIK_ENTRYPOINT}"
      traefik.http.routers.mhag-status-oauth.tls: "true"
      traefik.http.routers.mhag-status-oauth.tls.certresolver: "${TRAEFIK_CERTRESOLVER}"
      traefik.http.routers.mhag-status-oauth.middlewares: "mhag-status-ratelimit,mhag-status-headers"
      traefik.http.routers.mhag-status-oauth.service: "mhag-status-oauth"
      traefik.http.services.mhag-status-oauth.loadbalancer.server.port: "4180"
      # Pruefung je Anfrage; ohne Sitzung antwortet der Proxy 401, die Fehler-Middleware leitet zur Anmeldung um
      # und nimmt die urspruengliche Adresse als Ruecksprungziel mit.
      traefik.http.middlewares.mhag-status-auth.forwardauth.address: "http://mhag-status-oauth:4180/oauth2/auth"
      traefik.http.middlewares.mhag-status-auth.forwardauth.trustForwardHeader: "true"
      traefik.http.middlewares.mhag-status-fehler.errors.status: "401-403"
      traefik.http.middlewares.mhag-status-fehler.errors.service: "mhag-status-oauth"
      traefik.http.middlewares.mhag-status-fehler.errors.query: "/oauth2/sign_in?rd={url}"

networks:
  mess:
    # Festes Teilnetz, damit node-exporter auf der Gateway-Adresse lauschen kann (nur aus diesem Netz erreichbar).
    driver: bridge
    ipam:
      config:
        - subnet: "${STATUS_SUBNET}"
          gateway: "${STATUS_GATEWAY}"
  proxy:
    external: true
    name: "${TRAEFIK_NETWORK}"

volumes:
  prometheus-data: {}
