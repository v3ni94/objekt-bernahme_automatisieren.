# Statische Oberflaeche plus Leseabfragen an Prometheus; alles andere der Prometheus-Schnittstelle bleibt gesperrt.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Docker-DNS mit kurzer Gueltigkeit: die Adresse von prometheus wird je Anfrage aufgeloest, damit ein neu
    # aufgebauter Prometheus-Container ohne Neustart von nginx erreichbar bleibt.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $prometheus http://prometheus:9090;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /api/v1/query {
        limit_except GET { deny all; }
        proxy_pass $prometheus;
        proxy_read_timeout 60s;
    }
    location = /api/v1/query_range {
        limit_except GET { deny all; }
        proxy_pass $prometheus;
        proxy_read_timeout 60s;
    }
    location /api/ {
        return 404;
    }
    location ~* \.(js|css|png)$ {
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "public, max-age=604800" always;
    }
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
}
